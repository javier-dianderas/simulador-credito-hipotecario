<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Crédito Hipotecario</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>
    <header></header>
    <main>
        <div>
            <h1>Simulador de Crédito Hipotecario</h1>
            <section class="busqueda">
                <h2>Criterios de búsqueda</h2>
                <div class="filtros">
                    <div>
                        <label>Fecha / Hora</label>
                        <input id="fechaDesde" type="date"> - <input id="fechaHasta" type="date">
                    </div>
                    <div>
                        <label>Valor Inmueble</label>
                        <input id="valorInmuebleDesde" type="text"> - <input id="valorInmuebleHasta" type="text">
                    </div>
                    <div>
                        <label>Cuota Inicial</label>
                        <input id="cuotaInicialDesde" type="text"> - <input id="cuotaInicialHasta" type="text">
                    </div>
                    <div>
                        <label>TEA (%)</label>
                        <input id="teaDesde" type="text"> - <input id="teaHasta" type="text">
                    </div>
                    <div>
                        <label>Nro. Cuotas</label>
                        <input id="nroCuotasDesde" type="text"> - <input id="nroCuotasHasta" type="text">
                    </div>
                </div>
                <div class="acciones">
                    <div id="panelMensajes">
                        <ul id="listaMensajes">
                        </ul>
                    </div>
                    <div>
                        <button id="buscar" type="button">Buscar</button>
                        <button id="limpiar" type="button">Limpiar</button>
                    </div>
                </div>
            </section>
            <section class="resultados">
                <div>
                    <button id="agregarCredito">Agregar simulación</button>
                </div>
                <h2>Resultados</h2>
                <div id="resultadosCreditos">
                    <table>
                        <thead>
                            <tr>
                                <td>Id</td>
                                <td>Fecha / Hora</td>
                                <td>Valor Inmueble</td>
                                <td>Cuota Inicial</td>
                                <td>TEA (%)</td>
                                <td>Nro. Cuotas</td>
                                <td>Seguro Desgravamen Mensual (%)</td>
                                <td>Seguro Inmueble (%)</td>
                                <td>Fecha Desembolso</td>
                                <td>Simular</td>
                            </tr>
                        </thead>
                        <tbody id="filasCreditos">

                        </tbody>
                        <tfoot>

                        </tfoot>
                    </table>
                </div>
            </section>
        </div>
    </main>
    <footer></footer>
    <script src="assets/js/base.js"></script>
    <script src="assets/js/index.js"></script>
</body>

</html>
